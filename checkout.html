<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <title>Checkout - Gear Up Gadgets</title>    
    <!-- Favicon & Device Web Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon-64x64.png">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
    <!-- CSS libraries from template -->
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/icon/icomoon/style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Custom styling overriding everything -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body class="counter-scroll" style="background-color: var(--bg-main);">

    <div id="wrapper">
        <!-- Header placeholder -->
        <div id="header-placeholder"></div>

        <!-- Banner breadcrumbs -->
        <div class="py-4" style="background: rgba(10, 10, 15, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="container d-flex justify-content-between align-items-center flex-wrap">
                <h1 class="h3 text-white fw-bold m-0">CHECKOUT</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb m-0" style="background: none; padding: 0;">
                        <li class="breadcrumb-item"><a href="index.html" class="text-secondary">Home</a></li>
                        <li class="breadcrumb-item"><a href="cart.html" class="text-secondary">Cart</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Checkout</li>
                    </ol>
                </nav>
            </div>
        </div>

        <!-- Checkout Section -->
        <div class="py-5">
            <div class="container">
                <form onsubmit="handlePlaceOrder(event)">
                    <div class="row g-4" id="checkout-grid-container">
                        <!-- Left: Billing details form -->
                        <div class="col-lg-7 col-md-12">
                            <div class="p-4 rounded-3" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                                <h4 class="text-white fw-bold mb-4" style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">BILLING DETAILS</h4>
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6 col-12">
                                        <label class="text-secondary mb-1" style="font-size: 13px;">First Name *</label>
                                        <input type="text" class="form-control text-white" id="checkout-fname" required style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                    </div>
                                    <div class="col-md-6 col-12">
                                        <label class="text-secondary mb-1" style="font-size: 13px;">Last Name *</label>
                                        <input type="text" class="form-control text-white" id="checkout-lname" required style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="text-secondary mb-1" style="font-size: 13px;">Street Address *</label>
                                    <input type="text" class="form-control text-white" id="checkout-address" required placeholder="House number and street name" style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6 col-12">
                                        <label class="text-secondary mb-1" style="font-size: 13px;">Town / City *</label>
                                        <select class="form-select text-white" id="checkout-city" required style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                            <option value="Karachi">Karachi</option>
                                            <option value="Lahore">Lahore</option>
                                            <option value="Islamabad">Islamabad</option>
                                            <option value="Rawalpindi">Rawalpindi</option>
                                            <option value="Faisalabad">Faisalabad</option>
                                            <option value="Peshawar">Peshawar</option>
                                            <option value="Multan">Multan</option>
                                            <option value="Quetta">Quetta</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 col-12">
                                        <label class="text-secondary mb-1" style="font-size: 13px;">Phone Number *</label>
                                        <input type="tel" class="form-control text-white" id="checkout-phone" required placeholder="e.g. 03001234567" style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="text-secondary mb-1" style="font-size: 13px;">Email Address *</label>
                                    <input type="email" class="form-control text-white" id="checkout-email" required style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;">
                                </div>

                                <div class="mb-0">
                                    <label class="text-secondary mb-1" style="font-size: 13px;">Order Notes (Optional)</label>
                                    <textarea class="form-control text-white" id="checkout-notes" rows="4" placeholder="Notes about your order, e.g. special instructions for delivery." style="background-color: var(--bg-main); border-color: var(--border-color); padding: 10px 15px;"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Order summary & payment -->
                        <div class="col-lg-5 col-md-12">
                            <div class="p-4 rounded-3 mb-4" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                                <h4 class="text-white fw-bold mb-4" style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">YOUR ORDER</h4>
                                
                                <!-- Dynamic items summary list -->
                                <div id="checkout-summary-list" class="mb-4">
                                    <!-- Loaded by checkout.js -->
                                </div>

                                <!-- Coupon Code Section in Checkout -->
                                <div class="mb-3 pt-2 pb-3 border-top border-bottom" style="border-color: var(--border-color) !important;">
                                    <label class="text-secondary small fw-bold mb-2"><i class="fas fa-ticket-alt text-danger me-1"></i> Have a Promo / Free Shipping Coupon?</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="checkout-coupon-input" class="form-control text-white" placeholder="Promo code (e.g. FREESHIP)" style="background-color: var(--bg-main); border-color: var(--border-color); text-transform: uppercase;">
                                        <button class="btn btn-danger fw-bold" type="button" onclick="handleCheckoutApplyCoupon()">Apply</button>
                                        <button class="btn btn-outline-secondary" type="button" onclick="handleCheckoutRemoveCoupon()" title="Clear Coupon"><i class="fas fa-times"></i></button>
                                    </div>
                                </div>

                                <!-- Dynamic totals summary -->
                                <div id="checkout-summary-totals">
                                    <!-- Loaded by checkout.js -->
                                </div>
                            </div>

                            <!-- Payment method -->
                            <div class="p-4 rounded-3" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                                <h5 class="text-white fw-bold mb-3"><i class="fas fa-money-bill-wave text-success me-2"></i> PAYMENT METHOD</h5>
                                <label class="form-check d-flex align-items-center gap-2 text-white mb-0" for="checkout-payment-cod">
                                    <input class="form-check-input m-0" type="radio" id="checkout-payment-cod" name="payment-method" value="Cash on Delivery" checked>
                                    <span class="fw-bold">Cash on Delivery</span>
                                </label>

                                <button type="submit" class="btn-checkout w-100 py-3 mt-4 text-center fw-bold shadow-sm">
                                    <i class="fas fa-check-circle me-2"></i> PLACE ORDER
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer placeholder -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Core Scripts -->
    <script src="assets/js/products-data.js"></script>
    <script src="assets/js/gug-erp-core.js"></script>
    <script src="assets/js/common.js"></script>
    <!-- Firebase Compat SDKs & Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-sync.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
