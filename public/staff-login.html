<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal Login | GearUp Gadgets ERP</title>    
    <!-- Favicon & Device Web Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon-64x64.png">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <!-- CSS Libraries -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/font-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <style>
        body {
            background-color: var(--gug-bg-color, #07090d) !important;
            background-image: var(--gug-bg-image) !important;
            background-attachment: var(--gug-bg-attachment, fixed) !important;
            background-size: var(--gug-bg-size, cover, cover, 28px 49px) !important;
            background-position: var(--gug-bg-position, center top) !important;
            background-repeat: var(--gug-bg-repeat, no-repeat, no-repeat, repeat) !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .staff-login-card {
            background: rgba(10, 10, 15, 0.55) !important;
            backdrop-filter: blur(24px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-top: 3px solid var(--accent-red) !important;
            border-radius: 18px !important;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.06) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 16px rgba(229, 3, 3, 0.35) !important;
        }
        .input-group-text {
            background-color: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: rgba(255, 255, 255, 0.85) !important;
        }
    </style>
</head>
<body>

<div class=staff-login-card>
    <div class=text-center mb-4>
        <div class=d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 border border-danger border-opacity-25 rounded-circle p-3 mb-2 style=width: 60px; height: 60px;>
            <i class=fas fa-id-badge text-danger fs-3></i>
        </div>
        <h4 class=fw-bold text-white mb-1>Staff Workspace Portal</h4>
        <p class=text-secondary small mb-0>GearUp Gadgets &bull; Employee Role Authentication</p>
    </div>

    <form id=staff-login-form>
        <div class=mb-3>
            <label class=form-label text-light small fw-bold>Employee Username or ID</label>
            <div class=input-group>
                <span class=input-group-text><i class=fas fa-user></i></span>
                <input type=text id=staff-username class=form-control placeholder=e.g., warehouse, rashid, farhan... required autocomplete=username>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label text-light small fw-bold mb-0">Password</label>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="staff-password" class="form-control" placeholder="Enter assigned password" value="" required autocomplete="off">
                <button class="btn btn-outline-secondary btn-security-toggle" type="button" onclick="togglePasswordVisibility('staff-password', 'toggle-pw-icon')" title="Show/Hide Password"><i class="fas fa-eye text-secondary" id="toggle-pw-icon"></i></button>
            </div>
        </div>

        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm mb-3">
            <i class="fas fa-right-to-bracket me-2"></i> Log In to Workspace
        </button>

        <div id="staff-login-error" class="alert alert-danger text-center p-2 small mb-0" style="display: none;"></div>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <div class="text-center small text-secondary">
            <a href="index.html" class="text-secondary text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Return to Public Storefront</a>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/products-data.js"></script>
    <!-- Firebase Compat SDKs & Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-sync.js"></script>
    <script src="assets/js/gug-erp-core.js"></script>
<script>
    function togglePasswordVisibility(target, iconTarget) {
            const inputId = (typeof target === 'string') ? target : 'staff-password';
            const iconId = (typeof iconTarget === 'string') ? iconTarget : 'toggle-pw-icon';
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }

    document.addEventListener('DOMContentLoaded', () => {
        const errorBox = document.getElementById('staff-login-error');

        // Check if redirected due to suspension
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('suspended') === 'true') {
            if (errorBox) {
                errorBox.innerHTML = '<i class="fas fa-ban me-1"></i> <strong>ACCOUNT PAUSED:</strong> Your employee account has been paused / suspended by the Administrator. You have been automatically logged out and restricted from performing any actions.';
                errorBox.style.display = 'block';
            }
        }

        // Auto-redirect if already logged in as staff
        if (localStorage.getItem('staff_logged_in') === 'true') {
            const currentStaffId = localStorage.getItem('staff_user_id');
            if (window.GUG_DB && window.GUG_DB.isEmployeeSuspended && window.GUG_DB.isEmployeeSuspended(currentStaffId)) {
                localStorage.removeItem('staff_logged_in');
                localStorage.removeItem('staff_user_id');
                if (errorBox) {
                    errorBox.innerHTML = '<i class="fas fa-ban me-1"></i> <strong>ACCOUNT SUSPENDED:</strong> Your employee ID is currently paused by Administrator.';
                    errorBox.style.display = 'block';
                }
            } else {
                window.location.href = 'employee-portal.html';
                return;
            }
        }

        const form = document.getElementById('staff-login-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('staff-username').value.trim();
            const password = document.getElementById('staff-password').value.trim();
            errorBox.style.display = 'none';

            const authResult = window.GUG_DB.authenticateStaff(username, password);

            if (authResult.success) {
                const emp = authResult.employee;
                const permissions = Array.isArray(emp.permissions) ? emp.permissions : window.GUG_DB.getRoleDefaultPermissions(emp.role);

                // Initialize Staff Session strictly isolated from Admin
                localStorage.setItem('staff_logged_in', 'true');
                localStorage.setItem('staff_username', emp.username);
                localStorage.setItem('staff_user_id', emp.id);
                localStorage.setItem('staff_name', emp.name);
                localStorage.setItem('staff_role', emp.role);
                localStorage.setItem('staff_department', emp.department || 'Operations');
                localStorage.setItem('staff_permissions', JSON.stringify(permissions));

                // Record real-time login activity in HR module
                if (window.GUG_DB && typeof window.GUG_DB.recordEmployeeLogin === 'function') {
                    window.GUG_DB.recordEmployeeLogin(emp.id);
                }

                // Preserve Admin Session if present so Super Admin testing is seamless

                window.GUG_DB.logAudit({
                    action: 'STAFF_PORTAL_LOGIN_SUCCESS',
                    entity: 'AUTH_SESSION',
                    entityId: emp.id,
                    newValue: 'Staff Authenticated: ' + emp.name + ' (' + emp.role + ') &bull; Allowed: ' + permissions.length + ' modules',
                    reason: 'Employee logged into Staff Workspace Portal',
                    user: emp.name,
                    role: emp.role
                });

                // Redirect strictly to Employee Portal Workspace
                window.location.href = 'employee-portal.html';
            } else {
                if (authResult.isPaused) {
                    errorBox.innerHTML = '<i class="fas fa-ban me-1"></i> <strong>ACCESS RESTRICTED:</strong> ' + authResult.message;
                } else {
                    errorBox.innerText = authResult.message || 'Invalid staff credentials.';
                }
                errorBox.style.display = 'block';

                window.GUG_DB.logAudit({
                    action: 'STAFF_PORTAL_LOGIN_FAILED',
                    entity: 'AUTH_SESSION',
                    entityId: username,
                    newValue: 'Authentication Rejected',
                    reason: authResult.message || 'Invalid credentials entered on staff login portal',
                    user: username,
                    role: 'Unauthenticated Staff'
                });
            }
        });
    });
</script>
</body>
</html>
