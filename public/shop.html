                            <span class="active-filter-pill">
                                <span>${p.label}</span>
                                <button type="button" data-key="${p.key}" aria-label="Remove filter">&times;</button>
                            </span>
                        `).join('')}
                        <button class="btn-clear-all" type="button" id="btn-clear-all-pills">
                            <i class="fa-solid fa-rotate-left me-1"></i> Clear All
                        </button>
                    </div>
                `;

                // Show toolbar reset button
                const rBtn = document.getElementById('btn-reset-filters');
                if (rBtn) rBtn.style.display = 'inline-block';

                // Attach pill dismiss events
                container.querySelectorAll('.active-filter-pill button').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const key = this.getAttribute('data-key');
                        if (key === 'brand') {
                            currentBrand = '';
                            try {
                                const newUrl = new URL(window.location.href);
                                newUrl.searchParams.delete('brand');
                                window.history.pushState({ category: currentCategory }, '', newUrl.toString());
                            } catch (e) {}
                        } else {
                            delete activeAttributes[key];
                        }
                        currentPage = 1;
                        updateActiveButtons();
                        renderDynamicFilterBar();
                        applyFilters();
                    });
                });

                const clearAllBtn = container.querySelector('#btn-clear-all-pills');
                if (clearAllBtn) {
                    clearAllBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        resetAllFilters();
                    });
                }
            }

            function resetAllFilters() {
                activeAttributes = {};
                currentBrand = '';
                currentPage = 1;
                try {
                    const newUrl = new URL(window.location.href);
                    newUrl.searchParams.delete('brand');
                    window.history.pushState({ category: currentCategory }, '', newUrl.toString());
                } catch (e) {}
                updateActiveButtons();
                renderDynamicFilterBar();
                applyFilters();
            }
            window.resetAllFilters = resetAllFilters;

            // --- GRID VIEW & PAGINATION WITH EMPTY STATE ---
            function updateGridView() {
                const emptyContainer = document.getElementById('shop-empty-state-container');
                const paginationNav = document.getElementById('shop-pagination-wrapper') || (paginationControls ? paginationControls.closest('nav') : null);

                if (activeProducts.length === 0) {
                    // Hide main grid and pagination completely
                    if (mainGrid) {
                        mainGrid.classList.add('d-none');
                        mainGrid.innerHTML = '';
                    }
                    if (paginationNav) paginationNav.classList.add('d-none');
                    if (paginationControls) paginationControls.innerHTML = '';

                    // Reveal centered empty state screen
                    if (emptyContainer) {
                        emptyContainer.classList.remove('d-none');
                        emptyContainer.innerHTML = `
                            <div class="shop-empty-state-card">
                                <div class="empty-state-icon-wrapper">
                                    <i class="fa-solid fa-box-open empty-state-icon"></i>
                                </div>
                                <h3 class="text-white fw-bold mb-2">No Products Found</h3>
                                <h6 class="mb-3" style="color: #cbd5e1; font-weight: 500;">No search results match your criteria</h6>
                                <p class="mx-auto mb-4" style="max-width: 520px; color: #94a3b8; font-size: 13.5px; line-height: 1.6;">
                                    We couldn't find any items matching your active filter criteria. Try resetting attribute filters to explore all available gear.
                                </p>
                                <div class="d-flex align-items-center justify-content-center gap-3 flex-wrap">
                                    <button class="btn btn-danger px-4 py-2 rounded-pill fw-bold" onclick="resetAllFilters()">
                                        <i class="fa-solid fa-rotate-left me-2"></i> Reset All Filters
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                    return;
                }

                // If products exist, hide empty state and show grid & pagination
                if (emptyContainer) {
                    emptyContainer.classList.add('d-none');
                    emptyContainer.innerHTML = '';
                }
                if (mainGrid) mainGrid.classList.remove('d-none');
                if (paginationNav) paginationNav.classList.remove('d-none');

                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const paginatedItems = activeProducts.slice(startIndex, endIndex);

                mainGrid.innerHTML = paginatedItems.map((p, index) => renderCard(p, index)).join('');
                  
                mainGrid.querySelectorAll('.slide-hidden').forEach(el => {
                    if (window.gugScrollObserver) {
                        window.gugScrollObserver.observe(el);
                    }
                });
                attachCartEvents(mainGrid);
                
                const totalPages = Math.ceil(activeProducts.length / itemsPerPage);
                renderPagination(totalPages);
            }

            function matchCategory(p, query) {
                if (!query || query === 'all') return true;
                const q = (query || '').toLowerCase().trim();
                const c = ((p.category || '') + '').toLowerCase().trim();
                const t = (((p.title || '') + ' ' + (p.name || '')) + '').toLowerCase().trim();

                switch (q) {
                    case 'mobiles':
                    case 'mobile':
                    case 'smartphones':
                        return (c === 'mobiles' || c === 'mobile phones & gadgets' || (c.includes('mobile') && !c.includes('smartwatch'))) &&
                               !t.includes('watch') && !t.includes('pad') && !t.includes('buds') && !t.includes('earbuds') && !t.includes('power bank');
                    case 'mouse':
                    case 'mice':
                        return (c === 'mouse' || c.includes('mice') || c.includes('pointing') || t.includes('mouse')) && !t.includes('mousepad');
                    case 'laptops':
                    case 'laptop':
                        return c.includes('laptop') || c.includes('macbook') || t.includes('laptop') || t.includes('macbook');
                    case 'computers':
                    case 'computer':
                    case 'desktop':
                    case 'desktops':
                    case 'pc':
                        return (c.includes('desktop') || c === 'computers') && !t.includes('laptop') && !t.includes('mouse');
                    case 'cpu':
                    case 'processor':
                    case 'processors':
                        return c.includes('processor') || c.includes('cpu') || t.includes('core i') || t.includes('ryzen') || t.includes('intel core');
                    case 'monitors':
                    case 'monitor':
                        return c === 'monitors' || (t.includes('monitor') && !t.includes('arm') && !t.includes('light bar'));
                    case 'graphics':
                    case 'graphics cards':
                    case 'gpu':
                        return c.includes('graphic') || c.includes('gpu') || t.includes('geforce') || t.includes('rtx') || t.includes('radeon');
                    case 'keyboards':
                    case 'keyboard':
                        return c.includes('keyboard') || t.includes('keyboard');
                    case 'tablets':
                    case 'tablet':
                    case 'tablets & pads':
                        return c.includes('tablet') || c.includes('ipad') || t.includes('pad 2') || t.includes('pad 7') || t.includes('pad 8') || t.includes('writing tab') || t.includes('focus pen');
                    case 'headphones':
                    case 'headphone':
                    case 'headphones & audio':
                        return c.includes('headphone') || c.includes('headset') || t.includes('earbuds') || t.includes('buds') || t.includes('earphones');
                    case 'speakers':
                    case 'speaker':
                    case 'audio & speakers':
                        return c.includes('speaker') || c.includes('acoustic') || t.includes('soundbar') || t.includes('sound outdoor') || t.includes('sound pocket') || t.includes('sound party');
                    case 'smart-home':
                    case 'smart home':
                    case 'smart home & ac':
                        return c.includes('smart home') || c.includes('appliance') || t.includes('inverter') || t.includes('purifier') || t.includes('vacuum') || t.includes('humidifier') || t.includes('scale') || t.includes('toothbrush') || t.includes('hair dryer') || t.includes('massage gun') || t.includes('blender') || t.includes('toaster') || t.includes('espresso') || t.includes('fan') || t.includes('lamp') || t.includes('bulb') || t.includes('lint remover');
                    case 'smartwatches':
                    case 'smartwatch':
                        return c.includes('smartwatch') || c.includes('wearable') || t.includes('watch') || t.includes('band 10') || t.includes('band 11');
                    case 'power':
                    case 'power & chargers':
                        return c.includes('power') || c.includes('charger') || t.includes('power bank') || t.includes('adapter') || t.includes('gan');
                    case 'networking':
                    case 'networking & wireless':
                        return c.includes('network') || c.includes('wireless') || t.includes('router') || t.includes('extender') || t.includes('switch') || t.includes('camera c') || t.includes('camera cw') || t.includes('tapo');
                    case 'accessories':
                    case 'accessories & cables':
                        return c.includes('accessor') || c.includes('cable') || t.includes('cable') || t.includes('selfie stick') || t.includes('screwdriver');
                    default:
                        return c === q || c.includes(q) || t.includes(q);
                }
            }

            function applyFilters() {
                let filtered = getCatalog();
                
                // 1. Category Filter
                if (currentCategory && currentCategory !== 'all') {
                    filtered = filtered.filter(p => matchCategory(p, currentCategory));
                }
                
                // 2. Brand Filter
                if (currentBrand) {
                    const cb = currentBrand.toLowerCase();
                    filtered = filtered.filter(p => {
                        const pb = ((p.brand || '') + '').toLowerCase();
                        const pt = (((p.name || '') + ' ' + (p.title || '')) + '').toLowerCase();
                        return pb === cb || pb.includes(cb) || pt.includes(cb);
                    });
                }

                // 3. Global Search Filter (URL query param)
                if (currentSearch) {
                    const s = currentSearch.toLowerCase();
                    filtered = filtered.filter(p => 
                        (p.name || p.title || '').toLowerCase().includes(s) || 
                        (p.category || '').toLowerCase().includes(s) ||
                        (p.brand || '').toLowerCase().includes(s) ||
                        (p.description || '').toLowerCase().includes(s) ||
                        (p.sku || '').toLowerCase().includes(s)
                    );
                }

                // 4. Sales Event Filter
                if (currentSale) {
                    filtered = filtered.filter(p => p.onSale === true);
                }

                // 5. Context-Aware Attribute Filters
                if (activeAttributes.priceRange) {
                    filtered = filtered.filter(p => matchPriceRange(p, activeAttributes.priceRange));
                }

                if (currentCategory === 'mobiles') {
                    if (activeAttributes.ram) {
                        filtered = filtered.filter(p => matchMobileRam(p, activeAttributes.ram));
                    }
                    if (activeAttributes.rom) {
                        filtered = filtered.filter(p => matchMobileRom(p, activeAttributes.rom));
                    }
                } else if (currentCategory === 'laptops') {
                    if (activeAttributes.processor) {
                        filtered = filtered.filter(p => matchProcessor(p, activeAttributes.processor));
                    }
                    if (activeAttributes.ram) {
                        filtered = filtered.filter(p => matchRamGeneral(p, activeAttributes.ram));
                    }
                    if (activeAttributes.storage) {
                        filtered = filtered.filter(p => matchStorageGeneral(p, activeAttributes.storage));
                    }
                } else if (currentCategory === 'computers') {
                    if (activeAttributes.processor) {
                        filtered = filtered.filter(p => matchProcessor(p, activeAttributes.processor));
                    }
                    if (activeAttributes.ram) {
                        filtered = filtered.filter(p => matchRamGeneral(p, activeAttributes.ram));
                    }
                    if (activeAttributes.storage) {
                        filtered = filtered.filter(p => matchStorageGeneral(p, activeAttributes.storage));
                    }
                } else if (currentCategory === 'mouse') {
                    if (activeAttributes.connectivity) {
                        filtered = filtered.filter(p => matchMouseConnectivity(p, activeAttributes.connectivity));
                    }
                    if (activeAttributes.usageType) {
                        filtered = filtered.filter(p => matchMouseUsage(p, activeAttributes.usageType));
                    }
                } else if (currentCategory === 'monitors') {
                    if (activeAttributes.screenSize) {
                        filtered = filtered.filter(p => matchScreenSize(p, activeAttributes.screenSize));
                    }
                    if (activeAttributes.resolution) {
                        filtered = filtered.filter(p => matchResolution(p, activeAttributes.resolution));
                    }
                    if (activeAttributes.refreshRate) {
                        filtered = filtered.filter(p => matchRefreshRate(p, activeAttributes.refreshRate));
                    }
                } else {
                    if (activeAttributes.availability === 'in-stock') {
                        filtered = filtered.filter(p => {
                            const stockQty = typeof window.getProductStockNumber === 'function' ? window.getProductStockNumber(p) : (p.totalStock || p.stockQuantity || 0);
                            return stockQty > 0;
                        });
                    } else if (activeAttributes.availability === 'on-sale') {
                        filtered = filtered.filter(p => p.onSale === true);
                    }
                }

                // 6. Dynamic Sorting
                if (currentSort === 'price-asc') {
                    filtered.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
                } else if (currentSort === 'price-desc') {
                    filtered.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
                } else if (currentSort === 'newest') {
                    filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
                } else if (currentSort === 'name-asc') {
                    filtered.sort((a, b) => (a.name || a.title || '').localeCompare(b.name || b.title || ''));
                } else {
                    filtered.sort((a, b) => (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0));
                }

                activeProducts = filtered;
                
                // Update Title properly
                let titleParts = [];
                if (currentSale) titleParts.push("SPECIAL DEALS");
                if (currentSearch) titleParts.push(`Search: "${currentSearch}"`);
                if (currentBrand) titleParts.push(currentBrand.toUpperCase());
                
                const catObj = DISTINCT_CATEGORIES.find(c => c.slug === currentCategory);
                const catDisplayName = catObj ? catObj.name : (currentCategory === 'all' || !currentCategory ? 'All Products' : currentCategory);

                if (currentCategory === 'all' || !currentCategory) {
                    if (titleParts.length === 0) titleParts.push("ALL PRODUCTS (" + filtered.length + ")");
                    else titleParts.push("PRODUCTS (" + filtered.length + ")");
                } else {
                    titleParts.push(catDisplayName.toUpperCase() + " (" + filtered.length + ")");
                }
                
                if (shopTitle) shopTitle.innerText = titleParts.join(" | ");

                // Update indicators
                const countInd = document.getElementById('shop-count-indicator');
                if (countInd) countInd.innerText = `Showing ${filtered.length} items`;
                const filteredMatches = document.getElementById('filtered-matches-count');
                if (filteredMatches) filteredMatches.innerText = `${filtered.length} models found`;

                renderActiveFilterPills();
                updateGridView();
            }

            function filterCategory(cat) {
                currentCategory = cat || 'all';
                currentBrand = '';
                activeAttributes = {};
                currentPage = 1;

                if (currentCategory === 'mobiles') {
                    isMobileSubmenuOpen = true;
                } else {
                    isMobileSubmenuOpen = false;
                }

                try {
                    const newUrl = new URL(window.location.href);
                    if (currentCategory === 'all') {
                        newUrl.searchParams.delete('category');
                    } else {
                        newUrl.searchParams.set('category', currentCategory);
                    }
                    newUrl.searchParams.delete('brand');
                    window.history.pushState({ category: currentCategory }, '', newUrl.toString());
                } catch (e) {}

                updateActiveButtons();
                renderDynamicFilterBar();
                applyFilters();
                window.scrollTo({ top: 120, behavior: 'smooth' });
            }

            // Expose resetAllFilters to window so empty state button can call it
            window.resetAllFilters = resetAllFilters;

            // Initialize Sort Dropdown Interactive Events
            function initSortDropdown() {
                const sortContainer = document.getElementById('sort-dropdown-container');
                if (!sortContainer) return;
                const sortBtn = sortContainer.querySelector('.custom-dropdown-btn');
                if (sortBtn) {
                    sortBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        toggleCustomDropdown(sortContainer);
                    });
                }
                sortContainer.querySelectorAll('.custom-dropdown-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const val = this.getAttribute('data-value');
                        currentSort = val;

                        // Highlight in dropdown
                        sortContainer.querySelectorAll('.custom-dropdown-item').forEach(it => {
                            it.classList.toggle('active', it.getAttribute('data-value') === val);
                        });
                        const textEl = document.getElementById('sort-dropdown-current-text');
                        if (textEl) textEl.innerText = this.innerText;

                        const nativeSel = document.getElementById('shop-sort-select');
                        if (nativeSel) nativeSel.value = val;

                        sortContainer.classList.remove('is-open');
                        if (sortBtn) sortBtn.setAttribute('aria-expanded', 'false');

                        currentPage = 1;
                        applyFilters();
                    });
                });
            }
            initSortDropdown();

            // Native Sorting select fallback listener
            const sortSelect = document.getElementById('shop-sort-select');
            if (sortSelect) {
                sortSelect.addEventListener('change', function() {
                    currentSort = this.value;
                    currentPage = 1;
                    applyFilters();
                });
            }

            window.addEventListener('popstate', function() {
                const params = new URLSearchParams(window.location.search);
                const popCat = (params.get('category') || 'all').toLowerCase().trim();
                const matched = DISTINCT_CATEGORIES.find(c => c.slug === popCat || c.name.toLowerCase() === popCat);
                currentCategory = matched ? matched.slug : (popCat || 'all');
                currentBrand = params.get('brand') || '';
                activeAttributes = {};
                currentPage = 1;
                isMobileSubmenuOpen = (currentCategory === 'mobiles');
                updateActiveButtons();
                renderDynamicFilterBar();
                applyFilters();
            });

            // Initialize Dynamic Filter Bar and Product Grid
            renderDynamicFilterBar();
            applyFilters();

            window.addEventListener('productsReady', () => {
                _shopCatalogCache = null;
                buildCategorySidebar();
                renderDynamicFilterBar();
                applyFilters();
            });
            window.addEventListener('gugProductsUpdated', () => {
                _shopCatalogCache = null;
                buildCategorySidebar();
                renderDynamicFilterBar();
                applyFilters();
            });
        });
    </script>
</body>
</html>
