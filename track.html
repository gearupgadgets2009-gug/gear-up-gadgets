<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <title>Track Status | Gear Up Gadgets</title>    
    <!-- Favicon & Device Web Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon-64x64.png">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/icon/icomoon/style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .timeline {
            position: relative;
            padding: 20px 0;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--border-color);
            z-index: 1;
            transform: translateY(-50%);
        }
        .timeline-step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
        }
        .timeline-step .step-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--bg-main);
            border: 4px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            color: #888;
            font-weight: bold;
            transition: 0.3s;
        }
        .timeline-step.completed .step-icon {
            border-color: var(--accent-red);
            background-color: var(--accent-red);
            color: white;
        }
        .timeline-step.active .step-icon {
            border-color: var(--accent-red);
            background-color: var(--bg-main);
            color: var(--accent-red);
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
        }
        .timeline-step .step-label {
            color: #888;
            font-size: 13px;
            font-weight: 600;
        }
        .timeline-step.completed .step-label,
        .timeline-step.active .step-label {
            color: white;
        }
        .timeline-progress {
            position: absolute;
            top: 50%;
            left: 0;
            height: 4px;
            background-color: var(--accent-red);
            z-index: 1;
            transform: translateY(-50%);
            transition: width 0.5s ease;
        }
    </style>
</head>

<body class="counter-scroll" style="background-color: var(--bg-main);">

    <div id="wrapper">
        <div id="header-placeholder"></div>

        <div class="py-4" style="background: rgba(10, 10, 15, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="gug-container d-flex justify-content-between align-items-center flex-wrap">
                <h1 class="h3 text-white fw-bold m-0">TRACK STATUS</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb m-0" style="background: none; padding: 0;">
                        <li class="breadcrumb-item"><a href="index.html" class="text-secondary">Home</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Track Status</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="py-5">
            <div class="gug-container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        
                        <div class="p-5 rounded-3 mb-5 text-center" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                            <h2 class="text-white fw-bold mb-3">Track Order, Repair or Data Recovery</h2>
                            <p class="text-secondary mb-4">Enter your Tracking ID (Orders), Diagnose ID (Repairs), or Case ID (Data Recovery) to see real-time updates.</p>
                            
                            <form id="track-form" class="d-flex max-w-lg mx-auto" onsubmit="event.preventDefault(); trackStatus();">
                                <input type="text" id="track-id" class="form-control text-white" placeholder="e.g. GUG-ORD-123456, GUG-REP-123456, or GUG-REC-123456" required style="background-color: var(--bg-main); border-color: var(--border-color); padding: 15px; border-radius: 6px 0 0 6px;">
                                <button type="submit" class="btn btn-danger px-4 fw-bold" style="background-color: var(--accent-red); border: none; border-radius: 0 6px 6px 0;">TRACK</button>
                            </form>
                        </div>

                        <!-- Result Container -->
                        <div id="track-result" style="display: none;"></div>

                    </div>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>

    <script src="assets/js/products-data.js"></script>
    <script src="assets/js/gug-erp-core.js"></script>
    <script src="assets/js/common.js"></script>
    <!-- Firebase Compat SDKs & Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-sync.js"></script>
    <script>
        async function trackStatus() {
            const inputEl = document.getElementById('track-id');
            const inputId = inputEl ? inputEl.value.trim() : '';
            const resultDiv = document.getElementById('track-result');
            
            if (!inputId || !resultDiv) return;

            const cleanQuery = inputId.toLowerCase();
            const orders = (window.GUG_DB && typeof window.GUG_DB.getOrders === 'function')
                ? window.GUG_DB.getOrders()
                : (JSON.parse(localStorage.getItem('admin_orders')) || []);
            const repairs = (window.GUG_DB && typeof window.GUG_DB.getRepairRequests === 'function')
                ? window.GUG_DB.getRepairRequests()
                : (JSON.parse(localStorage.getItem('admin_repair_requests')) || []);
            const recoveries = (window.GUG_DB && typeof window.GUG_DB.getRecoveryRequests === 'function')
                ? window.GUG_DB.getRecoveryRequests()
                : (JSON.parse(localStorage.getItem('admin_recovery_requests')) || []);

            let foundOrder = orders.find(o => String(o.id || '').trim().toLowerCase() === cleanQuery);
            let foundRepair = repairs.find(r => String(r.diagnoseId || '').trim().toLowerCase() === cleanQuery || String(r.id || '').trim().toLowerCase() === cleanQuery);
            let foundRecovery = recoveries.find(r => String(r.caseId || '').trim().toLowerCase() === cleanQuery || String(r.id || '').trim().toLowerCase() === cleanQuery);

            // Live Cloud Fallback Lookup
            if (!foundOrder && !foundRepair && !foundRecovery && window.GUG_FIREBASE) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="p-4 rounded-3 text-center" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                        <div class="spinner-border text-danger mb-2" role="status"></div>
                        <div class="text-white">Connecting to Cloud Database to verify ID...</div>
                    </div>
                `;
                if (typeof window.GUG_FIREBASE.getOrderById === 'function') {
                    foundOrder = await window.GUG_FIREBASE.getOrderById(inputId);
                }
                if (!foundOrder && typeof window.GUG_FIREBASE.getRepairById === 'function') {
                    foundRepair = await window.GUG_FIREBASE.getRepairById(inputId);
                }
                if (!foundOrder && !foundRepair && typeof window.GUG_FIREBASE.getRecoveryById === 'function') {
                    foundRecovery = await window.GUG_FIREBASE.getRecoveryById(inputId);
                }
            }

            if (foundOrder) {
                renderOrderTracking(foundOrder, resultDiv);
            } else if (foundRepair) {
                renderRepairTracking(foundRepair, resultDiv);
            } else if (foundRecovery) {
                renderRecoveryTracking(foundRecovery, resultDiv);
            } else {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="p-4 rounded-3 text-center" style="background-color: #2b1111; border: 1px solid var(--accent-red);">
                        <i class="fas fa-exclamation-circle text-danger mb-3" style="font-size: 40px;"></i>
                        <h4 class="text-white fw-bold">ID Not Found</h4>
                        <p class="text-secondary m-0">We couldn't find any order, repair, or data recovery case associated with that ID. Please check the number and try again.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('id') || params.get('order') || params.get('track');
            if (q) {
                const input = document.getElementById('track-id');
                if (input) {
                    input.value = q;
                    trackStatus();
                }
            }
        });

        function renderOrderTracking(order, container) {
            const stages = ["Pending", "Processing", "Dispatched", "Delivered"];
            const currentStageIdx = stages.indexOf(order.status) > -1 ? stages.indexOf(order.status) : 0;
            const progressWidth = (currentStageIdx / (stages.length - 1)) * 100;

            let timelineHtml = `<ul class="timeline m-0 p-0">`;
            timelineHtml += `<div class="timeline-progress" style="width: ${progressWidth}%;"></div>`;
            
            stages.forEach((stage, idx) => {
                let statusClass = '';
                if (idx < currentStageIdx) statusClass = 'completed';
                else if (idx === currentStageIdx) statusClass = 'active';

                timelineHtml += `
                    <li class="timeline-step ${statusClass}">
                        <div class="step-icon"><i class="fas ${getIconForOrderStage(idx)}"></i></div>
                        <div class="step-label">${stage}</div>
                    </li>
                `;
            });
            timelineHtml += `</ul>`;

            container.style.display = 'block';
            container.innerHTML = `
                <div class="p-5 rounded-3" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4" style="border-color: var(--border-color) !important;">
                        <h4 class="text-white fw-bold m-0"><i class="fas fa-box-open text-danger me-2"></i> Order Status</h4>
                        <span class="badge bg-danger fs-6">${order.status}</span>
                    </div>
                    
                    <div class="mb-5 px-3">
                        ${timelineHtml}
                    </div>

                    <div class="p-4 rounded-3" style="background-color: var(--bg-main);">
                        <h6 class="text-secondary mb-3 border-bottom pb-2" style="border-color: var(--border-color) !important;">Order Information</h6>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <span class="d-block text-secondary small">Tracking ID</span>
                                <span class="text-white fw-bold">${order.id}</span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <span class="d-block text-secondary small">Customer</span>
                                <span class="text-white fw-bold">${order.name}</span>
                            </div>
                            <div class="col-sm-12">
                                <span class="d-block text-secondary small">Shipping Address</span>
                                <span class="text-white">${order.address}, ${order.city}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRepairTracking(repair, container) {
            const stages = ["Pending", "Device Received", "Diagnosing", "Waiting for Parts", "Repair in Progress", "Ready for Collection"];
            const currentStageIdx = stages.indexOf(repair.status) > -1 ? stages.indexOf(repair.status) : 0;
            const progressWidth = (currentStageIdx / (stages.length - 1)) * 100;

            let timelineHtml = `<ul class="timeline m-0 p-0">`;
            timelineHtml += `<div class="timeline-progress" style="width: ${progressWidth}%;"></div>`;
            
            stages.forEach((stage, idx) => {
                let statusClass = '';
                if (idx < currentStageIdx) statusClass = 'completed';
                else if (idx === currentStageIdx) statusClass = 'active';

                timelineHtml += `
                    <li class="timeline-step ${statusClass}">
                        <div class="step-icon"><i class="fas ${getIconForRepairStage(idx)}"></i></div>
                        <div class="step-label" style="font-size: 11px;">${stage}</div>
                    </li>
                `;
            });
            timelineHtml += `</ul>`;

            container.style.display = 'block';
            container.innerHTML = `
                <div class="p-5 rounded-3" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4" style="border-color: var(--border-color) !important;">
                        <h4 class="text-white fw-bold m-0"><i class="fas fa-tools text-danger me-2"></i> Repair Status</h4>
                        <span class="badge bg-danger fs-6">${repair.status}</span>
                    </div>
                    
                    <div class="mb-5">
                        ${timelineHtml}
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="p-4 rounded-3 h-100" style="background-color: var(--bg-main);">
                                <h6 class="text-secondary mb-3 border-bottom pb-2" style="border-color: var(--border-color) !important;">Request Information</h6>
                                <div class="mb-3">
                                    <span class="d-block text-secondary small">Diagnose ID</span>
                                    <span class="text-white fw-bold">${repair.diagnoseId}</span>
                                </div>
                                <div class="mb-3">
                                    <span class="d-block text-secondary small">Customer</span>
                                    <span class="text-white fw-bold">${repair.name}</span>
                                </div>
                                <div class="mb-0">
                                    <span class="d-block text-secondary small">Reported Issue</span>
                                    <span class="text-white" style="font-size: 14px;">${repair.details}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="p-4 rounded-3 h-100" style="background: rgba(220, 53, 69, 0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(220, 53, 69, 0.35); box-shadow: 0 16px 40px rgba(0,0,0,0.5);">
                                <h6 class="text-danger mb-3 border-bottom pb-2 border-danger">Admin Diagnosis Notes</h6>
                                <div class="text-white" style="font-size: 14px; white-space: pre-wrap;">${repair.diagnosisNotes ? repair.diagnosisNotes : '<span class="text-secondary fst-italic">No diagnosis notes provided yet. The admin will update this section after examining your device.</span>'}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getIconForOrderStage(idx) {
            const icons = ["fa-clock", "fa-cog", "fa-truck", "fa-check-circle"];
            return icons[idx] || "fa-dot-circle";
        }

        function getIconForRepairStage(idx) {
            const icons = ["fa-clock", "fa-box", "fa-search", "fa-microchip", "fa-wrench", "fa-check-circle"];
            return icons[idx] || "fa-dot-circle";
        }

        function getIconForRecoveryStage(idx) {
            const icons = ["fa-file-invoice", "fa-box", "fa-microscope", "fa-database", "fa-check-double"];
            return icons[idx] || "fa-circle-dot";
        }

        function renderRecoveryTracking(recovery, container) {
            const stages = ["Pending Inspection", "Media Received", "Diagnostic / Hex Scan", "Recovery in Progress", "Completed"];
            const currentStatus = recovery.status || "Pending Inspection";
            
            let stageIndex = 0;
            if (currentStatus === "Media Received") stageIndex = 1;
            else if (currentStatus === "Diagnostic / Hex Scan") stageIndex = 2;
            else if (currentStatus === "Recovery in Progress" || currentStatus === "Data Cloned / Verified" || currentStatus === "Ready for Delivery") stageIndex = 3;
            else if (currentStatus === "Completed") stageIndex = 4;
            else if (currentStatus === "Unrecoverable") stageIndex = 2;

            const progressWidth = (stageIndex / (stages.length - 1)) * 100;

            let timelineHtml = `<ul class="timeline m-0 p-0">`;
            timelineHtml += `<div class="timeline-progress" style="width: ${progressWidth}%; background-color: #2563eb;"></div>`;
            
            stages.forEach((stage, idx) => {
                let statusClass = '';
                if (idx < stageIndex) statusClass = 'completed';
                else if (idx === stageIndex) statusClass = 'active';

                timelineHtml += `
                    <li class="timeline-step ${statusClass}">
                        <div class="step-icon" style="${statusClass === 'active' || statusClass === 'completed' ? 'border-color: #2563eb; color: #3b82f6;' : ''}"><i class="fas ${getIconForRecoveryStage(idx)}"></i></div>
                        <div class="step-label" style="font-size: 11px;">${stage}</div>
                    </li>
                `;
            });
            timelineHtml += `</ul>`;

            const phone = recovery.phone || recovery.mobileNumber || '';
            const wa = (recovery.whatsapp || recovery.whatsappNumber || phone).replace(/[^0-9]/g, '');

            container.style.display = 'block';
            container.innerHTML = `
                <div class="p-5 rounded-3" style="background-color: var(--bg-card); border: 1px solid #1e3a8a;">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4" style="border-color: #1e293b !important;">
                        <div>
                            <h4 class="text-white fw-bold m-0"><i class="fas fa-database text-primary me-2"></i> Data Recovery Case Status</h4>
                            <small class="text-secondary">Cleanroom Laboratory Services</small>
                        </div>
                        <span class="badge ${currentStatus === 'Completed' ? 'bg-success' : (currentStatus === 'Unrecoverable' ? 'bg-danger' : 'bg-primary')} fs-6 px-3 py-2">${currentStatus}</span>
                    </div>
                    
                    <div class="mb-5">
                        ${timelineHtml}
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="p-4 rounded-3 h-100" style="background-color: var(--bg-main); border: 1px solid #1e293b;">
                                <h6 class="text-primary mb-3 border-bottom pb-2" style="border-color: #1e293b !important;"><i class="fas fa-hard-drive me-2"></i> Case & Media Specs</h6>
                                <div class="mb-2">
                                    <span class="d-block text-secondary small">Case ID</span>
                                    <code class="text-primary fw-bold fs-6">${recovery.caseId || recovery.id}</code>
                                </div>
                                <div class="mb-2">
                                    <span class="d-block text-secondary small">Customer</span>
                                    <span class="text-white fw-semibold">${recovery.name || recovery.fullName}</span>
                                </div>
                                <div class="mb-2">
                                    <span class="d-block text-secondary small">Storage Device</span>
                                    <span class="text-white fw-bold">${recovery.mediaType || 'Media'}</span> &bull; <span class="text-secondary">${recovery.mediaBrandCapacity || 'Standard'}</span>
                                </div>
                                <div class="mb-2">
                                    <span class="d-block text-secondary small">Failure Scenario</span>
                                    <span class="text-danger">${recovery.failureType || 'Hardware fault'}</span>
                                </div>
                                <div>
                                    <span class="d-block text-secondary small">Critical Target Files</span>
                                    <span class="text-white">${recovery.criticalData || 'All data'}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="p-4 rounded-3 h-100" style="background: rgba(14, 165, 233, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(14, 165, 233, 0.35); box-shadow: 0 16px 40px rgba(0,0,0,0.5);">
                                <h6 class="text-info mb-3 border-bottom pb-2 border-primary border-opacity-50"><i class="fas fa-microscope me-2"></i> Lab Recovery Notes & Cost</h6>
                                <div class="text-white mb-3" style="font-size: 14px; white-space: pre-wrap;">${recovery.labNotes ? recovery.labNotes : '<span class="text-secondary fst-italic">Our data recovery engineers are currently assessing your storage media in the diagnostics cleanroom. Notes will appear here once initial sector analysis is complete.</span>'}</div>
                                ${recovery.estimatedCost ? `
                                    <div class="p-2 rounded bg-dark border border-secondary mb-3">
                                        <span class="text-secondary small d-block">Estimated Quoted Cost:</span>
                                        <span class="text-success fw-bold fs-5">Rs. ${recovery.estimatedCost}</span>
                                    </div>
                                ` : ''}
                                ${wa ? `
                                    <a href="https://wa.me/923219876543?text=Hello%20Gear%20Up%20Gadgets,%20inquiring%20about%20my%20Data%20Recovery%20case%20(${recovery.caseId || recovery.id})..." target="_blank" class="btn btn-sm btn-outline-success w-100 py-2 fw-semibold">
                                        <i class="fab fa-whatsapp me-2"></i> Contact Lab via WhatsApp
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
